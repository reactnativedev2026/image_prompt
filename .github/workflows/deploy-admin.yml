name: Deploy Admin Panel

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  deploy-admin:
    name: Build & Deploy Admin Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH commands to build and deploy Admin
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Navigating to project folder..."
            cd /var/www/prompt-backend
            
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Building Admin Panel..."
            cd admin
            npm install
            npm run build
            
            echo "🚀 Deploying build to /var/www/html (Nginx web root)..."
            mkdir -p /var/www/html
            cp -r dist/* /var/www/html/
            
            echo "🔄 Reloading Nginx..."
            sudo nginx -t && sudo systemctl reload nginx
            
            echo "✅ Admin Panel deployed successfully!"
