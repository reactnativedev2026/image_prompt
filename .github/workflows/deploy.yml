name: Deploy Admin Panel to Server

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy-admin:
    name: Pull & Build on Server
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH commands to update and build on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🚀 Navigating to project folder..."
            cd /var/www/prompt-backend
            
            echo "📥 Pulling latest code from git..."
            git pull origin main
            
            echo "📦 Building Admin Panel..."
            cd admin
            npm install
            npm run build
            
            echo "🚀 Deploying build to /var/www/html (Nginx web root)..."
            mkdir -p /var/www/html
            cp -r dist/* /var/www/html/
            
            echo "🔄 Restarting Backend & Reloading Nginx..."
            sudo systemctl restart prompt-backend 2>/dev/null || sudo systemctl restart uvicorn 2>/dev/null || sudo pm2 restart all 2>/dev/null || true
            sudo systemctl reload nginx
            
            echo "✅ Deployment completed successfully!"
