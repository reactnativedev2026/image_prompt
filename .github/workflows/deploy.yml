name: CI/CD Deploy Backend & Admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "=========================================================="
            echo "🚀 STARTING CI/CD DEPLOYMENT: $(date)"
            echo "=========================================================="

            # Step 1: Navigate to repository
            echo "📂 Navigating to project directory..."
            cd /var/www/prompt-backend

            # Step 2: Pull latest changes
            echo "📥 Pulling latest code from GitHub (origin/main)..."
            git fetch origin main
            git reset --hard origin/main

            # Step 3: Backend Setup & Python Dependencies
            echo "🐍 Updating Backend..."
            if [ -d "backend/venv" ]; then
              source backend/venv/bin/activate
              pip install --no-cache-dir -r backend/requirements.txt
            elif [ -d "venv" ]; then
              source venv/bin/activate
              pip install --no-cache-dir -r backend/requirements.txt
            fi

            # Step 4: Restart Backend Service
            echo "🔄 Restarting Backend Service (prompt-backend)..."
            sudo systemctl restart prompt-backend || true

            # Step 5: Admin Panel Build & Deploy
            echo "📦 Building & Deploying Admin Panel..."
            if [ -d "admin" ]; then
              cd admin
              npm install
              npm run build
              echo "🚀 Copying Admin build to /var/www/html (Nginx web root)..."
              mkdir -p /var/www/html
              cp -r dist/* /var/www/html/
              cd ..
            fi

            # Step 6: Reload Nginx
            echo "🌐 Reloading Nginx Web Server..."
            sudo nginx -t && sudo systemctl reload nginx

            # Step 7: Verify Status
            echo "🔍 Verifying Services Status..."
            sudo systemctl is-active --quiet prompt-backend && echo "✅ Backend Service: ACTIVE" || echo "⚠️ Backend Service: NOT RUNNING"
            sudo systemctl is-active --quiet nginx && echo "✅ Nginx Server: ACTIVE" || echo "⚠️ Nginx Server: NOT RUNNING"

            echo "=========================================================="
            echo "🎉 CI/CD DEPLOYMENT COMPLETED SUCCESSFULLY!"
            echo "=========================================================="
