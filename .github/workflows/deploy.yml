name: Deploy Admin Panel to Server

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy-admin:
    name: Build & Deploy Admin Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin Dependencies & Build
        run: |
          cd admin
          npm ci
          npm run build

      - name: Clean Old Build on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            mkdir -p /var/www/html
            rm -rf /var/www/html/assets /var/www/html/index.html /var/www/html/favicon.svg

      - name: Deploy Admin Build to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "admin/dist/**"
          target: "/var/www/html"
          strip_components: 2
          overwrite: true

      - name: Reload Nginx Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            sudo systemctl reload nginx
