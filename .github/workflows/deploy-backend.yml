name: Deploy Backend API

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Update & Restart Backend Service
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH commands to update and restart Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Navigating to project folder..."
            cd /var/www/prompt-backend
            
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Checking and installing Python dependencies if needed..."
            if [ -d "backend/venv" ]; then
              source backend/venv/bin/activate
              pip install --no-cache-dir -r backend/requirements.txt
            elif [ -d "venv" ]; then
              source venv/bin/activate
              pip install --no-cache-dir -r backend/requirements.txt
            fi
            
            echo "🔄 Restarting Backend Service..."
            sudo systemctl restart prompt-backend
            
            echo "🔍 Verifying Backend Service..."
            sudo systemctl is-active --quiet prompt-backend && echo "✅ Backend Service: ACTIVE" || echo "⚠️ Backend Service: NOT RUNNING"
            
            echo "✅ Backend API deployed and restarted successfully!"
