name: Deploy Backend API

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Update & Restart Backend Service
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH commands to update and restart Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🚀 Navigating to project folder..."
            cd /var/www/prompt-backend
            
            echo "📥 Pulling latest code..."
            git pull origin main
            
            echo "📦 Checking and installing Python dependencies if needed..."
            cd backend
            if [ -d "venv" ]; then
              source venv/bin/activate
              pip install -r requirements.txt
            elif [ -d "../venv" ]; then
              source ../venv/bin/activate
              pip install -r requirements.txt
            fi
            
            echo "🔄 Restarting Backend Service..."
            sudo systemctl restart prompt-backend 2>/dev/null || sudo systemctl restart uvicorn 2>/dev/null || sudo systemctl restart fastapi 2>/dev/null || sudo pm2 restart all 2>/dev/null || true
            
            echo "✅ Backend API deployed and restarted successfully!"
